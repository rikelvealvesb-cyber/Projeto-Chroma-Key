<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeoMap Ultra - Navegação Avançada</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <!-- Leaflet Rotated Marker -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.css" />

    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: var(--text-main);
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
            background-color: #0b0f19 !important;
        }

        .cyber-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-container {
            position: relative;
            width: 100%;
        }

        .search-container input {
            width: 100%;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        #search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
        }

        .result-item {
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }

        .result-item:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--text-main);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .transport-selector {
            display: flex;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
            flex: 1;
        }

        .transport-btn {
            flex: 1;
            background: transparent;
            border: none;
            border-radius: 8px;
            padding: 8px 0;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .transport-btn.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        #route-info-panel {
            display: none;
            background: rgba(2, 6, 23, 0.85);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 12px 14px;
            flex-direction: column;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .route-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .route-details span {
            color: var(--accent);
            font-weight: 600;
        }

        #btn-start-route {
            display: block !important;
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: transform 0.2s;
        }

        #btn-start-route:active {
            transform: scale(0.97);
        }

        #btn-recenter {
            display: none;
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            width: 56px;
            height: 56px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 50%;
            color: var(--accent);
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 15px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            align-items: center;
            justify-content: center;
        }

        #btn-recenter:hover {
            transform: scale(1.08);
            background: rgba(15, 23, 42, 0.9);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="cyber-panel">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Buscar destino (salvo offline)..." autocomplete="off">
            <div id="search-results"></div>
        </div>

        <div class="controls-row">
            <div class="transport-selector">
                <button class="transport-btn active" data-mode="foot" title="A pé">🚶</button>
                <button class="transport-btn" data-mode="bike" title="Bike">🚲</button>
                <button class="transport-btn" data-mode="motorcycle" title="Moto">🏍️</button>
                <button class="transport-btn" data-mode="car" title="Carro">🚗</button>
            </div>
        </div>

        <div id="route-info-panel">
            <div class="route-details">
                <div>Distância: <span id="dist-val">--</span></div>
                <div>Tempo: <span id="time-val">--</span></div>
            </div>
            <button id="btn-start-route">Iniciar Rota</button>
        </div>
    </div>

    <button id="btn-recenter" title="Voltar à sua localização">📍</button>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>

    <script>
        const DB_KEY = 'neomap_offline_places_v5';
        
        function getSavedPlaces() {
            try {
                return JSON.parse(localStorage.getItem(DB_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        function savePlaceToDB(query, placeData) {
            const db = getSavedPlaces();
            db[query.toLowerCase().trim()] = placeData;
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function searchLocalDB(query) {
            const db = getSavedPlaces();
            const q = query.toLowerCase().trim();
            const results = [];
            for (let key in db) {
                if (key.includes(q)) {
                    results.push(db[key]);
                }
            }
            return results;
        }

        const map = L.map('map', { 
            zoomControl: false,
            rotate: true,
            touchRotate: true,
            rotateControl: false,
            renderer: L.canvas() 
        }).setView([0, 0], 2);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap & CARTO',
            maxZoom: 22,
            updateWhenIdle: false,
            keepBuffer: 12,
            unloadInvisibleTiles: false
        }).addTo(map);

        let userCoords = null;
        let marker = null;
        let destinationCoords = null;
        let routePolyline = null;
        let rawRouteCoords = null;
        let following = true;
        let routeActive = false;
        let currentTransport = 'foot';

        const btnRecenter = document.getElementById('btn-recenter');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const routeInfoPanel = document.getElementById('route-info-panel');
        const distVal = document.getElementById('dist-val');
        const timeVal = document.getElementById('time-val');
        const btnStartRoute = document.getElementById('btn-start-route');

        const emojiMap = { foot: '🚶', bike: '🚲', motorcycle: '🏍️', car: '🚗' };

        function getUserIcon() {
            return L.divIcon({
                className: 'custom-user-marker',
                html: `<div style="font-size: 26px; filter: drop-shadow(0 0 8px rgba(56,189,248,0.8));">${emojiMap[currentTransport]}</div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
        }

        function updateLocation(pos) {
            userCoords = [pos.coords.latitude, pos.coords.longitude];

            if (!marker) {
                marker = L.marker(userCoords, { icon: getUserIcon() }).addTo(map);
                map.setView(userCoords, 19, { animate: true });
            } else {
                marker.setLatLng(userCoords);
                marker.setIcon(getUserIcon());
            }

            if (following) {
                map.setView(userCoords, map.getZoom(), { animate: true });
            }

            if (routeActive && destinationCoords) {
                fetchRouteGeometry(false);
            }
        }

        map.on('zoom zoomend move moveend', () => {
            if (routePolyline && rawRouteCoords) {
                routePolyline.redraw();
            }
        });

        map.on('dragstart zoomstart rotatestart', () => {
            following = false;
            btnRecenter.style.display = 'flex';
        });

        btnRecenter.onclick = () => {
            if (userCoords) {
                following = true;
                map.setView(userCoords, map.getZoom(), { animate: true });
                btnRecenter.style.display = 'none';
            }
        };

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(updateLocation, (err) => {
                console.error("Erro GPS:", err.message);
            }, {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            });
        }

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();

            if (query.length < 3) {
                searchResults.style.display = 'none';
                return;
            }

            searchTimeout = setTimeout(async () => {
                let places = [];
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&countrycodes=br`);
                    places = await response.json();
                    places.forEach(p => savePlaceToDB(query, p));
                } catch (err) {
                    places = searchLocalDB(query);
                }

                searchResults.innerHTML = '';
                if (places.length > 0) {
                    searchResults.style.display = 'block';
                    places.forEach(place => {
                        const div = document.createElement('div');
                        div.className = 'result-item';
                        div.textContent = place.display_name;
                        div.onclick = () => {
                            destinationCoords = [parseFloat(place.lat), parseFloat(place.lon)];
                            searchInput.value = place.display_name;
                            searchResults.style.display = 'none';
                            
                            routeActive = false;
                            rawRouteCoords = null;
                            if (routePolyline) {
                                map.removeLayer(routePolyline);
                                routePolyline = null;
                            }

                            following = false;
                            btnRecenter.style.display = 'flex';
                            map.setView(destinationCoords, 16, { animate: true });
                            calculateRouteInfo();
                        };
                        searchResults.appendChild(div);
                    });
                } else {
                    searchResults.style.display = 'none';
                }
            }, 350);
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.style.display = 'none';
            }
        });

        document.querySelectorAll('.transport-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.transport-btn').forEach(b => b.classList.remove('active'));
                const targetBtn = e.currentTarget;
                targetBtn.classList.add('active');
                currentTransport = targetBtn.getAttribute('data-mode');

                if (marker) marker.setIcon(getUserIcon());
                if (destinationCoords) {
                    if (routeActive) {
                        fetchRouteGeometry(true);
                    } else {
                        calculateRouteInfo();
                    }
                }
            });
        });

        const transportConfig = {
            foot: { osrm: 'foot', speedKmH: 4.5 },
            bike: { osrm: 'bike', speedKmH: 15.0 },
            motorcycle: { osrm: 'bike', speedKmH: 45.0 },
            car: { osrm: 'car', speedKmH: 35.0 }
        };

        async function calculateRouteInfo() {
            if (!userCoords || !destinationCoords) return;

            const config = transportConfig[currentTransport];
            const url = `https://router.project-osrm.org/route/v1/${config.osrm}/${userCoords[1]},${userCoords[0]};${destinationCoords[1]},${destinationCoords[0]}?overview=false`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const distanceKm = route.distance / 1000;
                    const calculatedMinutes = Math.max(1, Math.round((distanceKm / config.speedKmH) * 60));

                    distVal.textContent = distanceKm.toFixed(1) + ' km';
                    timeVal.textContent = calculatedMinutes + ' min';
                    routeInfoPanel.style.display = 'flex'; // Garante a exibição do painel e do botão internamente
                }
            } catch (err) {
                console.error("Erro ao calcular info da rota:", err);
            }
        }

        btnStartRoute.onclick = () => {
            if (!userCoords || !destinationCoords) return;

            routeActive = true;
            following = true;
            btnRecenter.style.display = 'none';
            
            // Mantém o painel de informações visível ou esconde conforme preferência (aqui mantemos ativo com os dados)
            fetchRouteGeometry(true);
        };

        async function fetchRouteGeometry(updateInfo = false) {
            if (!userCoords || !destinationCoords) return;

            const config = transportConfig[currentTransport];
            const url = `https://router.project-osrm.org/route/v1/${config.osrm}/${userCoords[1]},${userCoords[0]};${destinationCoords[1]},${destinationCoords[0]}?overview=full&geometries=geojson`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    rawRouteCoords = route.geometry.coordinates.map(c => [c[1], c[0]]);

                    if (routePolyline) {
                        routePolyline.setLatLngs(rawRouteCoords);
                        routePolyline.redraw();
                    } else {
                        routePolyline = L.polyline(rawRouteCoords, {
                            color: '#38bdf8',
                            weight: 8,
                            opacity: 0.9,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }).addTo(map);
                    }

                    if (updateInfo) {
                        const distanceKm = route.distance / 1000;
                        const calculatedMinutes = Math.max(1, Math.round((distanceKm / config.speedKmH) * 60));

                        distVal.textContent = distanceKm.toFixed(1) + ' km';
                        timeVal.textContent = calculatedMinutes + ' min';
                        routeInfoPanel.style.display = 'flex';
                    }
                }
            } catch (err) {
                console.error("Erro ao processar rota:", err);
            }
        }
    </script>
</body>
</html>
