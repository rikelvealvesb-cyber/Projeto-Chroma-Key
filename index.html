<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NeoMap Ultra</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        #map { height: 100vh; }
        
        .controls { position: absolute; top: 20px; left: 20px; z-index: 1000; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 280px; }
        select, input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
        
        #btn-recenter { display: none; position: absolute; bottom: 30px; right: 30px; z-index: 1000; padding: 12px; background: #007bff; color: white; border: none; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div class="controls">
    <input type="text" placeholder="Para onde vamos?">
    <select id="transport">
        <option value="pedestrian">🚶 A pé</option>
        <option value="bike">🚲 Bike</option>
        <option value="motorcycle">🏍️ Moto</option>
        <option value="car">🚗 Carro</option>
    </select>
</div>

<button id="btn-recenter">📍</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([-23.5505, -46.6333], 18); // Zoom bem próximo (18)
    
    // Mapa claro e minimalista (CartoDB Positron)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & CARTO'
    }).addTo(map);

    let marker, userCoords;
    let following = true;

    const btnRecenter = document.getElementById('btn-recenter');
    const transportSelect = document.getElementById('transport');

    // Função para atualizar o ícone baseado no transporte
    function getIcon() {
        const emoji = { pedestrian: '🚶', bike: '🚲', motorcycle: '🏍️', car: '🚗' };
        return L.divIcon({
            className: 'custom-marker',
            html: `<div style="font-size: 24px;">${emoji[transportSelect.value]}</div>`,
            iconSize: [30, 30]
        });
    }

    function updateLocation(pos) {
        userCoords = [pos.coords.latitude, pos.coords.longitude];
        
        if (!marker) {
            marker = L.marker(userCoords, { icon: getIcon() }).addTo(map);
        } else {
            marker.setLatLng(userCoords);
            marker.setIcon(getIcon());
        }

        if (following) {
            map.setView(userCoords, 18);
        }
    }

    // Detectar quando o usuário mexe no mapa
    map.on('dragstart', () => {
        following = false;
        btnRecenter.style.display = 'block';
    });

    btnRecenter.onclick = () => {
        following = true;
        map.setView(userCoords, 18);
        btnRecenter.style.display = 'none';
    };

    transportSelect.onchange = () => marker.setIcon(getIcon());

    navigator.geolocation.watchPosition(updateLocation, console.error, { enableHighAccuracy: true });
</script>
</body>
</html>
