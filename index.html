<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Loja - Gerenciamento</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-600 flex items-center gap-2">
                <i data-lucide="store" class="w-6 h-6"></i> Painel da Loja
            </h1>
            <span class="text-xs bg-orange-100 text-orange-700 font-bold px-3 py-1 rounded-full flex items-center gap-1">
                <i data-lucide="radio" class="w-3.5 h-3.5 animate-pulse"></i> Ao vivo
            </span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto p-4 animate-fade-in">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
            <i data-lucide="clipboard-list" class="w-5 h-5 text-orange-600"></i> Pedidos Recebidos
        </h2>
        
        <div id="lista-pedidos-loja" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Pedidos injetados em tempo real via JS -->
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://subjectrobot-49600-default-rtdb.firebaseio.com/",
            apiKey: "AlzaSyCTkqOuXy5kHg9N8r9--Dooh8cuguYxPE",
            storageBucket: "subjectrobot-49600.appspot.com",
            appId: "1:731604558049:android:7f47b30b289445814017a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function carregarPedidosLoja() {
            const container = document.getElementById('lista-pedidos-loja');

            onValue(ref(db, 'pedidos'), (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = `<div class="col-span-full text-center text-gray-400 py-16 bg-white rounded-2xl border border-dashed"><i data-lucide="package-open" class="w-12 h-12 mx-auto mb-2 opacity-50"></i><p>Nenhum pedido no momento</p></div>`;
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = '';
                
                // Converte o objeto do Firebase em array e ordena do mais recente para o mais antigo
                const pedidosArray = Object.keys(data).map(id => ({
                    id,
                    ...data[id]
                })).sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));

                pedidosArray.forEach(pedido => {
                    let corStatus = 'bg-orange-100 text-orange-700';
                    if (pedido.status === 'Preparando') corStatus = 'bg-yellow-100 text-yellow-700';
                    if (pedido.status === 'A caminho') corStatus = 'bg-blue-100 text-blue-700';
                    if (pedido.status === 'Entregue') corStatus = 'bg-green-100 text-green-700';

                    let botoesAcao = '';
                    if (pedido.status === 'Aguardando confirmação da loja') {
                        botoesAcao = `<button onclick="mudarStatus('${pedido.id}', 'Preparando')" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white text-xs py-2 rounded-xl font-bold transition flex items-center justify-center gap-1 shadow-md"><i data-lucide="chef-hat" class="w-4 h-4"></i> Aceitar e Preparar</button>`;
                    } else if (pedido.status === 'Preparando') {
                        botoesAcao = `<button onclick="mudarStatus('${pedido.id}', 'A caminho')" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs py-2 rounded-xl font-bold transition flex items-center justify-center gap-1 shadow-md"><i data-lucide="bike" class="w-4 h-4"></i> Enviar para Entrega</button>`;
                    } else if (pedido.status === 'A caminho') {
                        botoesAcao = `<button onclick="mudarStatus('${pedido.id}', 'Entregue')" class="w-full bg-green-600 hover:bg-green-700 text-white text-xs py-2 rounded-xl font-bold transition flex items-center justify-center gap-1 shadow-md"><i data-lucide="check-circle" class="w-4 h-4"></i> Concluir Entrega</button>`;
                    } else {
                        botoesAcao = `<span class="block text-center text-xs text-green-600 font-bold py-1">Pedido Finalizado</span>`;
                    }

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-mono font-bold text-gray-500">Cód: ${pedido.id.slice(-6)}</span>
                                <span class="text-xs px-2.5 py-1 rounded-full font-bold ${corStatus}">${pedido.status}</span>
                            </div>
                            
                            <div class="border-t border-b py-2 space-y-1 text-xs">
                                ${pedido.itens.map(i => `<div class="flex justify-between"><span>${i.qtd}x ${i.nome}</span><span>R$ ${(i.preco * i.qtd).toFixed(2)}</span></div>`).join('')}
                            </div>

                            <div class="text-xs bg-gray-50 p-2 rounded-xl space-y-1">
                                <p><strong>Forma:</strong> ${pedido.formaPagamento || 'Não informada'}</p>
                                <p><strong>Meio:</strong> ${pedido.meioPagamento || 'Não informado'}</p>
                            </div>

                            <div class="flex justify-between items-center text-sm font-bold pt-1">
                                <span>Total: R$ ${pedido.total.toFixed(2)}</span>
                            </div>

                            <div>
                                ${botoesAcao}
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();
            });
        }

        window.mudarStatus = async function(id, novoStatus) {
            try {
                await update(ref(db, `pedidos/${id}`), { status: novoStatus });
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
                alert("Erro ao alterar o status do pedido.");
            }
        }

        carregarPedidosLoja();
    </script>
</body>
</html>
