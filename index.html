<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chroma Key Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* O canvas ocupa a tela inteira exibindo o resultado em tempo real */
        #output-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Tela inicial de configuração / upload */
        #setup-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            color: #fff;
            text-align: center;
        }
        #setup-screen h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .btn-upload {
            background: #2ecc71;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        #bg-file-input {
            display: none;
        }
        /* Painel de calibração (ocultável após ajustes) */
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
            z-index: 5;
            display: flex;
            gap: 15px;
            color: white;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Elementos de vídeo e imagem de fundo ocultos usados no processamento */
        video, img#bg-image {
            display: none;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Tela de boas-vindas para carregar a imagem de fundo -->
    <div id="setup-screen">
        <h1>Chroma Key ao Vivo</h1>
        <p style="margin-bottom: 20px; font-size: 0.9rem; color: #ccc;">Escolha uma imagem de fundo da sua galeria para iniciar.</p>
        <label class="btn-upload">
            Escolher Imagem de Fundo
            <input type="file" id="bg-file-input" accept="image/*">
        </label>
    </div>

    <!-- Canvas principal onde a mágica acontece -->
    <canvas id="output-canvas"></canvas>

    <!-- Controles de calibração (podem ser ocultados com display: none após ajustes) -->
    <div id="controls-panel">
        <div class="control-group">
            <label>Tolerância (Threshold)</label>
            <input type="range" id="threshold" min="0" max="100" value="40">
        </div>
        <div class="control-group">
            <label>Suavidade (Smoothing)</label>
            <input type="range" id="smooth" min="0" max="50" value="10">
        </div>
    </div>

    <!-- Elementos ocultos -->
    <video id="webcam-video" autoplay playsinline muted></video>
    <img id="bg-image" alt="Fundo Personalizado">
    <!-- Canvas de suporte para processar os frames -->
    <canvas id="processing-canvas" style="display:none;"></canvas>
</div>

<script>
    const setupScreen = document.getElementById('setup-screen');
    const bgFileInput = document.getElementById('bg-file-input');
    const bgImage = document.getElementById('bg-image');
    const video = document.getElementById('webcam-video');
    const outputCanvas = document.getElementById('output-canvas');
    const ctx = outputCanvas.getContext('2d', { willReadFrequently: true });
    
    const processingCanvas = document.getElementById('processing-canvas');
    const pCtx = processingCanvas.getContext('2d', { willReadFrequently: true });

    const thresholdRange = document.getElementById('threshold');
    const smoothRange = document.getElementById('smooth');

    let isRunning = false;

    // 1. Passo: Usuário escolhe a imagem da galeria
    bgFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                bgImage.src = event.target.result;
                bgImage.onload = () => {
                    // Esconde a tela de setup e inicia a câmera
                    setupScreen.style.display = 'none';
                    initCamera();
                }
            }
            reader.readAsDataURL(file);
        }
    });

    // 2. Passo: Abertura da câmera traseira
    async function initCamera() {
        try {
            const constraints = {
                video: {
                    facingMode: { exact: "environment" }, // Tenta usar a câmera traseira como padrão
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };
            
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                // Fallback caso o celular não suporte "exact: environment"
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            }

            video.srcObject = stream;
            await video.play();

            // Configura os tamanhos dos canvases com base na resolução real do vídeo
            outputCanvas.width = video.videoWidth || 1280;
            outputCanvas.height = video.videoHeight || 720;
            processingCanvas.width = outputCanvas.width;
            processingCanvas.height = outputCanvas.height;

            isRunning = true;
            requestAnimationFrame(processFrame);
        } catch (error) {
            alert("Erro ao acessar a câmera. Verifique as permissões do navegador.");
            console.error(error);
            setupScreen.style.display = 'flex';
        }
    }

    // 3. Processamento em Tempo Real (Chroma Key)
    function processFrame() {
        if (!isRunning) return;

        const width = outputCanvas.width;
        const height = outputCanvas.height;

        // Desenha a imagem de fundo personalizada cobrindo todo o canvas
        ctx.drawImage(bgImage, 0, 0, width, height);
        const bgData = ctx.getImageData(0, 0, width, height);

        // Desenha o frame atual da câmera no canvas de processamento
        pCtx.drawImage(video, 0, 0, width, height);
        const webcamData = pCtx.getImageData(0, 0, width, height);

        const srcPixels = webcamData.data;
        const destPixels = bgData.data;

        const threshold = parseInt(thresholdRange.value) * 2.5; // Ajuste de escala
        const smooth = parseInt(smoothRange.value);

        // Loop pixel por pixel para remover o fundo verde (Chroma Key)
        for (let i = 0; i < srcPixels.length; i += 4) {
            let r = srcPixels[i];
            let g = srcPixels[i + 1];
            let b = srcPixels[i + 2];

            // Identifica a predominância do verde (Fundo Chroma Key)
            // Compara o canal verde com a média dos canais vermelho e azul
            let maxRb = Math.max(r, b);
            let diff = g - maxRb;

            if (diff > threshold) {
                // Se for verde, calcula a suavidade (edge spill/transparência gradual)
                let alphaFactor = 0;
                if (smooth > 0) {
                    let edgeDiff = diff - threshold;
                    alphaFactor = Math.min(1, edgeDiff / smooth);
                }

                if (alphaFactor < 1) {
                    // Mantém uma transição suave nas bordas para evitar cortes secos
                    srcPixels[i + 3] = alphaFactor * 255; 
                } else {
                    // Remove totalmente o pixel verde substituindo pelo fundo
                    srcPixels[i] = destPixels[i];
                    srcPixels[i + 1] = destPixels[i + 1];
                    srcPixels[i + 2] = destPixels[i + 2];
                    srcPixels[i + 3] = 255;
                }
            }
        }

        // Desenha o resultado processado da câmera (com o recorte aplicado) por cima do fundo
        pCtx.putImageData(webcamData, 0, 0);
        ctx.drawImage(processingCanvas, 0, 0);

        requestAnimationFrame(processFrame);
    }
</script>

</body>
</html>
