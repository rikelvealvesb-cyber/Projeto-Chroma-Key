<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mapa Personalizado</title>
    
    <!-- Importando o Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        /* Container do Mapa ocupando a tela toda */
        #map {
            width: 100%;
            height: 100vh;
            background-color: #1a1a1a;
        }

        /* Estilo personalizado para o painel flutuante */
        .map-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .map-overlay h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #00ffcc;
        }

        .map-overlay p {
            font-size: 0.85rem;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <!-- Painel de Design Único -->
    <div class="map-overlay">
        <h1>Meu NeoMap</h1>
        <p>Explorando com estilo próprio</p>
    </div>

    <!-- Elemento onde o mapa será renderizado -->
    <div id="map"></div>

    <!-- Importando o Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
    // 1. Inicializando o mapa
    const map = L.map('map', { zoomControl: false }).setView([0, 0], 2);

    // 2. Adicionando o design escuro
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap & CARTO',
        maxZoom: 20
    }).addTo(map);

    // 3. Marcador personalizado
    const customIcon = L.divIcon({
        className: 'custom-marker',
        html: '<div style="background-color: #00ffcc; width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 15px #00ffcc; border: 2px solid #fff;"></div>',
        iconSize: [16, 16]
    });

    let marker;

    // 4. Função para atualizar localização em tempo real
    function updateLocation(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        // Centraliza o mapa na posição do usuário com zoom aproximado (16)
        map.setView([lat, lng], 16);

        // Remove o marcador antigo se existir
        if (marker) {
            map.removeLayer(marker);
        }

        // Adiciona um novo marcador
        marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
        marker.bindPopup("Você está aqui! (Precisão: " + Math.round(accuracy) + "m)").openPopup();
    }

    // 5. Verifica se o navegador suporta geolocalização
    if (navigator.geolocation) {
        // watchPosition monitora mudanças em tempo real
        navigator.geolocation.watchPosition(updateLocation, (err) => {
            console.error("Erro ao obter localização: " + err.message);
        }, {
            enableHighAccuracy: true, // Tenta usar GPS para maior precisão
            timeout: 5000,
            maximumAge: 0
        });
    } else {
        alert("Geolocalização não suportada pelo seu navegador.");
    }
</script>

</body>
</html>
