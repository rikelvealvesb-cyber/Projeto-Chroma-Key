<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bíblia Sagrada 3D Online</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: radial-gradient(circle, #2c2c2c 0%, #111 100%); 
            height: 100vh; 
            width: 100vw;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden; 
            font-family: 'Georgia', serif; 
            position: fixed;
        }

        #nav-panel { 
            position: fixed; 
            top: 15px; 
            background: rgba(20, 20, 20, 0.95); 
            padding: 10px 15px; 
            border-radius: 8px; 
            z-index: 1000; 
            display: flex; 
            gap: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            border: 1px solid #444;
            max-width: 95vw;
            flex-wrap: wrap;
            justify-content: center;
        }

        #nav-panel select, #nav-panel button {
            padding: 6px 10px;
            background: #2c2c2c;
            color: #d4af37;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 0.85rem;
            font-family: 'Georgia', serif;
            outline: none;
            cursor: pointer;
        }

        #nav-panel button {
            background: #5c1d1d;
            border-color: #7a2828;
            font-weight: bold;
            transition: background 0.2s;
        }

        #nav-panel button:hover {
            background: #7a2828;
        }

        /* Palco 3D imitando a mesa com leve volume */
        #book-container {
            perspective: 2500px;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateX(12deg);
            transform-style: preserve-3d;
            width: 100%;
            height: 75vh;
        }

        #book { 
            box-shadow: 0 35px 70px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.5);
            display: none;
        }

        /* Textura e estilo realista das páginas */
        .page {
            background-color: #fbf8ef;
            background-image: linear-gradient(to right, #d3cbb7 0%, #fbf8ef 4%, #fbf8ef 96%, #d3cbb7 100%);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #c5bba4;
            overflow: hidden;
            user-select: none;
        }

        .page-cover {
            background-color: #3a1010;
            background-image: linear-gradient(135deg, #5c1d1d 0%, #220808 100%);
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            border: 2px solid #1a0505;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
        }

        .page h2 { 
            font-size: 1rem; 
            color: #5c1d1d; 
            margin-bottom: 10px; 
            border-bottom: 1px solid #d3cbb7; 
            padding-bottom: 5px; 
        }

        .page p { 
            font-size: 0.78rem; 
            line-height: 1.5; 
            text-align: justify; 
            margin-bottom: 6px; 
        }

        .page p span { 
            font-size: 0.62rem; 
            color: #8c7b60; 
            font-weight: bold; 
            margin-right: 4px; 
        }

        .page-footer { 
            text-align: center; 
            font-size: 0.65rem; 
            color: #888; 
            border-top: 1px solid #e8e2d0;
            padding-top: 6px;
        }

        #loading {
            color: #d4af37;
            font-size: 1.1rem;
            position: absolute;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="nav-panel">
        <select id="select-book"></select>
        <select id="select-chapter"></select>
        <button onclick="buscarTextoBiblico()">Abrir</button>
    </div>

    <div id="loading">Conectando à Bíblia online...</div>

    <div id="book-container">
        <div id="book">
            <div class="page page-cover">
                <div>
                    <h1 style="font-size: 1.8rem; border-bottom: 2px solid #d4af37; padding-bottom: 8px; margin-bottom: 8px;">BÍBLIA SAGRADA</h1>
                    <p style="font-size: 0.85rem; font-style: italic;">Carregando dados da rede...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pageFlip = null;

        // Estrutura de livros suportados pela API pública online
        const bibliaEstrutura = {
            "Gênesis": 50, "Êxodo": 40, "Levítico": 27, "Números": 36, "Deuteronômio": 34,
            "Josué": 24, "Juízes": 21, "Rute": 4, "1 Samuel": 31, "2 Samuel": 24,
            "1 Reis": 22, "2 Reis": 25, "Salmos": 150, "Provérbios": 31, "Isaías": 66,
            "Mateus": 28, "Marcos": 16, "Lucas": 24, "João": 21, "Atos": 28, "Apocalipse": 22
        };

        const apiBookMap = {
            "Gênesis": "genesis", "Êxodo": "exodus", "Levítico": "leviticus", "Números": "numbers", "Deuteronômio": "deuteronomy",
            "Josué": "joshua", "Juízes": "judges", "Rute": "ruth", "1 Samuel": "1samuel", "2 Samuel": "2samuel",
            "1 Reis": "1kings", "2 Reis": "2kings", "Salmos": "psalms", "Provérbios": "proverbs", "Isaías": "isaiah",
            "Mateus": "matthew", "Marcos": "mark", "Lucas": "luke", "João": "john", "Atos": "acts", "Apocalipse": "revelation"
        };

        const selectBook = document.getElementById('select-book');
        const selectChapter = document.getElementById('select-chapter');
        const loadingEl = document.getElementById('loading');
        const bookEl = document.getElementById('book');

        // Preenche o seletor de livros
        for (let livro in bibliaEstrutura) {
            let opt = document.createElement('option');
            opt.value = livro;
            opt.innerText = livro;
            selectBook.appendChild(opt);
        }

        // Atualiza os capítulos de acordo com o livro escolhido
        selectBook.addEventListener('change', () => {
            const total = bibliaEstrutura[selectBook.value] || 1;
            selectChapter.innerHTML = '';
            for (let i = 1; i <= total; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `Cap. ${i}`;
                selectChapter.appendChild(opt);
            }
        });

        selectBook.dispatchEvent(new Event('change'));

        async function buscarTextoBiblico() {
            loadingEl.style.display = 'block';
            loadingEl.innerText = "Buscando dados da rede...";
            bookEl.style.display = 'none';

            const livroPt = selectBook.value;
            const livroApi = apiBookMap[livroPt] || "genesis";
            const cap = selectChapter.value || 1;

            try {
                // Requisição HTTP via fetch para a API online
                const resposta = await fetch(`https://bible-api.com/${livroApi}+${cap}`);
                if (!resposta.ok) throw new Error("Erro na requisição da API");

                const dados = await resposta.json();
                renderizarLivro3D(dados.reference, dados.verses);

            } catch (erro) {
                console.error("Erro de rede:", erro);
                loadingEl.innerText = "Erro ao buscar dados da rede. Verifique a conexão.";
            }
        }

        function renderizarLivro3D(referencia, versiculos) {
            bookEl.innerHTML = '';

            // Capa interna do livro
            let capa = document.createElement('div');
            capa.className = 'page page-cover';
            capa.innerHTML = `<div><h2 style="color: #d4af37; font-size: 1.3rem; margin-bottom: 5px;">${referencia}</h2><p style="font-size:0.75rem; font-style: italic;">Santa Escritura</p></div>`;
            bookEl.appendChild(capa);

            // Paginação dinâmica dos versículos vindos da rede
            const porPagina = 6;
            for (let i = 0; i < versiculos.length; i += porPagina) {
                let pedaco = versiculos.slice(i, i + porPagina);
                let pDiv = document.createElement('div');
                pDiv.className = 'page';
                
                let htmlVersiculos = pedaco.map(v => `<p><span>${v.verse}</span> ${v.text}</p>`).join('');
                pDiv.innerHTML = `<div><h2>${referencia}</h2>${htmlVersiculos}</div><div class="page-footer">${Math.floor(i/porPagina) + 1}</div>`;
                bookEl.appendChild(pDiv);
            }

            loadingEl.style.display = 'none';
            bookEl.style.display = 'block';

            if (pageFlip) {
                pageFlip.destroy();
            }

            // Motor gráfico 3D com animações suaves e sombras dinâmicas de folha
            pageFlip = new St.PageFlip(bookEl, {
                width: 340,
                height: 480,
                size: 'stretch',
                minWidth: 260,
                maxWidth: 500,
                minHeight: 380,
                maxHeight: 700,
                flippingTime: 700,
                maxShadowOpacity: 0.75, // Sombra 3D profunda ao virar a página
                showCover: true,
                mobileScrollSupport: true,
                drawShadow: true,
                usePortrait: true
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
        }

        // Carrega o primeiro capítulo automaticamente ao publicar online
        window.onload = () => {
            buscarTextoBiblico();
        };
    </script>
</body>
</html>
